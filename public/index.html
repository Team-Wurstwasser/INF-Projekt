<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basisseite</title>
    <link rel="stylesheet" href="style/style.css">
</head>

<body>
    <header class="header">
        <img src="pics/logo.png">
        <h1 id="title">Werkzeuginventarisierung</h1>
        <button class="MenuButton"><img src="pics/menu.png"></button>
    </header>

    <div class="icon-header">
        <h1 class="HeaderIconÜbersicht">Übersicht Objekte</h1>
        <div class="ImpExpButtons">
            <button onclick="zeileHinzufuegen()">
                Objekt anlegen
                <img src="pics/plus.png" />
            </button>
            <button>
                Import
                <img src="pics/import.png" />
            </button>
            <button>
                Export
                <img src="pics/export.png" />
            </button>
        </div>
    </div>
    <div class= ="ObjektAuswahl">
        <button id="changeTitleButton">Alle Objekte</button>
        <button id="changeTitleButton">Funktionsfähig</button>
        <button id="changeTitleButton">In Wartung</button>
        <button id="changeTitleButton">Defekt</button>
    </div>
    <style>
        table {
            border-collapse: collapse;
            width: 50%;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
        }

        button {
            margin: 5px;
        }
    </style>



    <h2>Dynamische Tabelle</h2>

    <table id="objektTabelle">
        <tr>
            <th>Objekt</th>
            <th>Inventorio ID</th>
            <th>Modell</th>
            <th>Hersteller</th>
            <th>Raum</th>
            <th>Anzahl Tickets</th>
            <th>Objektstatus</th>
            <th>Löschen</th>
        </tr>
    </table>

    <button onclick="registerDialog()">
       TestDialog öffnen
    </button>


    <script src="scripts/scripts.js"></script>
</body>

</html>
