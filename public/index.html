<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Inventory</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="icon" type="image/png" href="pics/favicon.png">
</head>

<body>
    <header class="header">
        <img src="pics/logo.png">
        <h1 id="title">Easy Inventory</h1>
        <button class="MenuButton"><img src="pics/menu.png"></button>
    </header>
    <div class="icon-header">
        <h1 class="HeaderIconÜbersicht">Übersicht Objekte</h1>
        <div class="ImpExpButtons">
            <button onclick="objectCreationMethodSelectionDialog()">
                Objekt anlegen
                <img src="pics/plus.png" />
            </button>
            <button>
                Import
                <img src="pics/import.png" />
            </button>
            <button>
                Export
                <img src="pics/export.png" />
            </button>
        </div>
    </div>
    <div class= "ObjektAuswahl">
        <button id="changeTitleButton">Alle Objekte</button>
        <button id="changeTitleButton">Funktionsfähig</button>
        <button id="changeTitleButton">In Wartung</button>
        <button id="changeTitleButton">Defekt</button>
    </div>
    <label for="typeSelect">Kategorie:</label>
    <select id="typeSelect">
        <option value="werkzeuge">Werkzeuge</option>
        <option value="mitarbeiter">Mitarbeiter</option>
        <option value="werkzeug_typen">Werkzeugtypen</option>
        <option value="status">Status</option>
        <option value="werkzeug_typen">Werkzeugtypen</option>
        <option value="abteilung">Abteilungen</option>
        <option value="ausgeliehen">Ausgeliehene Werkzeuge</option>
        <option value="ausgeliehen_historie">Ausleih Historie</option>
    </select>
    <button id="loadButton" onclick="showTable()">Daten laden</button>
    <div class="table-container">
        <table id="objektTabelle">
            <thead>
                <tr id="headerRow"></tr>
            </thead>
            <tbody id="tableData"></tbody>
        </table>
    </div>

<dialog id="objectCreationMethodSelectionDialog">
    <h2>Wie möchten Sie ein neues Objekt anlegen ?</h2>
    <button id="scannerMode">Barcode scannen
        <img src="pics/scanBarcode.png" alt="">
    </button>
    <button id="manualMode">Barcode Erstellen
                <img src="pics/createBarcode.png" alt="">

    </button>
    <button class="closeBtn" id="closeBtn"> <img src="pics/close.png" alt="X"></button>
</dialog>

<dialog id="objectCreateScanBarcodeDialog">
    <h2>Neues Objekt anlegen</h2>
    <h2>Bitte den Barcode scannen.</h2>
    <button id="closeBtn1">Schließen</button>
</dialog>


<dialog id="objectConfigDialog">
    <h2>Objekt konfigurieren</h2>
    <h2>Bitte folgende Informationen eingeben:</h2>
    <input type="text" id="objectID" placeholder="Objekt ID" autocomplete="off">
    <input type="text" id="objectName" placeholder="Objektbezeichnung" autofocus autocomplete="off">
    Werkzeugtyp:   <select id="typeSelect">
        <option value="werkzeuge">Werkzeuge</option>
        <option value="mitarbeiter">Mitarbeiter</option>
        <option value="werkzeug_typen">Werkzeugtypen</option>
        <option value="status">Status</option>
        <option value="werkzeug_typen">Werkzeugtypen</option>
        <option value="abteilung">Abteilungen</option>
        <option value="ausgeliehen">Ausgeliehene Werkzeuge</option>
        <option value="ausgeliehen_historie">Ausleih Historie</option>
    </select>
    <div>Anschaffungsdatum:</div>
    <input type="date" id="objectPurchaseDate" placeholder="Anschaffungsdatum" autocomplete="off">
    <button id="objectSubmitBtn">Bestätigen</button> 
</dialog>

<dialog id="createdObjectOverviewDialog">
    <h2>Erstelltes Objekt übersicht</h2>
    <p id="objectOverviewID">ID: </p>
    <p id="objectOverviewName">Name: </p>
    <p id="objectOverviewPurchaseDate">Anschaffungsdatum: </p>
    <br>
    <br>
    <img id="barcodeimg" src="">
   <br>
    <button id="closeCreatedObjectOverviewBtn">Schließen</button>
</dialog>


    <script src="scripts/scripts.js"></script>
</body>

</html>
